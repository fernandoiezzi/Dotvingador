<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Dot Vingador - Menu</title>
    <style>
        body { 
            background: #000; 
            color: #fff; 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
        }
        h1 { 
            color: #ff4757; 
            font-size: 60px; 
            text-shadow: 5px 5px #333; 
            margin-bottom: 40px;
            text-align: center;
        }
        button.main-btn { 
            background: #222; 
            color: #fff; 
            border: 2px solid #fff; 
            padding: 15px 30px; 
            font-size: 20px; 
            cursor: pointer; 
            display: block; 
            margin: 15px; 
            width: 280px; 
            font-family: inherit;
            transition: 0.2s;
        }
        button.main-btn:hover { 
            background: #fff; 
            color: #000; 
            transform: scale(1.05);
        }
        
        /* Estilo da caixa de recordes */
        #highscoreDisplay { 
            font-size: 24px; 
            color: #67e8f9; 
            margin-top: 30px; 
            text-align: center;
            line-height: 1.6;
            display: none; /* Escondido por padrão */
            border: 2px dashed #67e8f9;
            padding: 20px;
            border-radius: 10px;
            background: rgba(103, 232, 249, 0.1);
        }

        /* Botão menor e vermelho para apagar registos */
        .btn-limpar {
            background: #ff4757;
            color: white;
            border: 1px solid #fff;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            font-family: inherit;
            border-radius: 5px;
            transition: 0.2s;
        }
        .btn-limpar:hover {
            background: #e02424;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>DOT VINGADOR</h1>
    
    <button class="main-btn" onclick="window.location.href='game.html'">NOVO JOGO</button>
    <button class="main-btn" onclick="toggleHighscore()">HIGHSCORES</button>

    <div id="highscoreDisplay">
        🏆 <strong>RECORDES ATUAIS</strong> 🏆<br><br>
        Moedas: <span id="hsScore" style="color: #fbbf24;">0</span><br>
        Melhor Tempo: <span id="hsTime" style="color: #10b981;">--:--</span><br>
        
        <button class="btn-limpar" onclick="limparRegistros()">LIMPAR REGISTROS</button>
    </div>

    <script>
        // Função para ir buscar os dados atualizados ao navegador
        function atualizarDadosHighscore() {
            let s = localStorage.getItem('bestScore') || 0;
            let t = localStorage.getItem('bestTime') || "--:--";
            document.getElementById('hsScore').innerText = s;
            document.getElementById('hsTime').innerText = t;
        }

        // Função que abre e fecha a caixa
        function toggleHighscore() {
            let display = document.getElementById('highscoreDisplay');
            
            if (display.style.display === 'block') {
                display.style.display = 'none'; // Esconde
            } else {
                atualizarDadosHighscore(); // Atualiza os números antes de mostrar
                display.style.display = 'block'; // Mostra
            }
        }

        // Função nova para APAGAR os registos
        function limparRegistros() {
            // Pede confirmação ao jogador
            let confirmacao = confirm("Tens a certeza que queres apagar os teus recordes? Esta ação não pode ser desfeita!");
            
            if (confirmacao) {
                // Remove as chaves da memória do navegador
                localStorage.removeItem('bestScore');
                localStorage.removeItem('bestTime');
                
                // Atualiza a tela imediatamente para mostrar 0 e --:--
                atualizarDadosHighscore();
                
                alert("Recordes apagados com sucesso!");
            }
        }
    </script>
</body>
</html>
